name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Test collector and policies
        run: zsh test.sh
      - name: Build native application
        run: zsh build.sh
      - name: Verify application signature
        run: codesign --verify --deep --strict 'build/Codex Finch.app'
